<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول - 7booba</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="site-header" id="siteHeader">
        <nav class="navbar container">
            <a href="index.html" class="brand"><span class="brand-logo"><i class="fa-solid fa-utensils"></i></span><span class="brand-text"><strong>7booba</strong></span></a>
            <button class="nav-toggle" id="navToggle"><span></span><span></span><span></span></button>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">الرئيسية</a></li>
                <li data-nav-auth></li>
            </ul>
        </nav>
    </header>
    <div id="flashSlot"></div>

    <section class="auth-section">
        <div class="auth-card">
            <h1 style="text-align:center; margin-bottom:20px;">تسجيل الدخول</h1>
            <form class="form" id="loginForm">
                <div class="form-group"><label>البريد الإلكتروني</label><input type="email" name="email" required></div>
                <div class="form-group"><label>كلمة المرور</label><input type="password" name="password" required></div>
                <button type="submit" class="btn btn-primary btn-block">دخول</button>
                <p style="text-align:center; margin-top:15px; font-size:14px;">ليس لديك حساب؟ <a href="register.html" style="color:var(--gold);">أنشئ حساب</a></p>
            </form>
        </div>
    </section>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/script.js"></script>
</body>
</html>
